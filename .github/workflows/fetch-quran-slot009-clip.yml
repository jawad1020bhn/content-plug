name: Fetch Quran slot 009 clip

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/a7c1b45e-content-plug"
    paths:
      - ".github/triggers/fetch-quran-slot009-clip.trigger"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + yt-dlp + gallery-dl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp gallery-dl

      - name: Fetch 009 clip from Pinterest (always writes report)
        run: python tools/fetch_slot009_clip.py

      - name: Commit report + clip evidence
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/quran/009_ta-ha_20-13_ghaith-samreen/pinterest_pin"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Slot 009 clip fetch report (pin.it/69696p6RX)"
          git push origin "HEAD:$BRANCH"

      - name: Verify success
        run: |
          python -c "import json; r=json.load(open('assets/quran/009_ta-ha_20-13_ghaith-samreen/pinterest_pin/report.json')); print(json.dumps(r, indent=1)[:2000]); assert r['status']=='success', r['status']"
          test -s "assets/quran/009_ta-ha_20-13_ghaith-samreen/pinterest_pin/clip.mp4"
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height -of json \
            "assets/quran/009_ta-ha_20-13_ghaith-samreen/pinterest_pin/clip.mp4"
