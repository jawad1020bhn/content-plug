name: Recon Quran slot 008 Invidious audio import

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/dbbc82a8-content-plug"
    paths:
      - ".github/triggers/recon-quran-slot008-invid-import.trigger"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape Invidious audio import links (always writes recon)
        run: python tools/import_slot008_invid.py

      - name: Probe Invidious/Piped APIs (always writes recon)
        run: python tools/recon_slot008_invid.py

      - name: Commit recon evidence
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/quran/008_ta-ha_20-13_ghaith-samreen/audio_recon"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Slot 008 aggregator recon evidence"
          git push origin "HEAD:$BRANCH"
