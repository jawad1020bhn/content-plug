name: Fetch Quran v2 assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and downloaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --disable-pip-version-check yt-dlp pillow

      - name: Fetch Slot 002 Pinterest clip and Sheikh Ali Jaber recitation
        run: python tools/fetch_quran_slot002_assets.py

      - name: Verify saved assets
        run: |
          test -s "assets/quran/002_al-baqarah_2-155-157_ali-jaber/SOURCE.md"
          test -s "assets/quran/002_al-baqarah_2-155-157_ali-jaber/recitation_raw.m4a"
          test -n "$(find assets/quran/002_al-baqarah_2-155-157_ali-jaber/pinterest -maxdepth 1 -name '*.mp4' -print -quit)"
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,sample_rate,channels -of json \
            "assets/quran/002_al-baqarah_2-155-157_ali-jaber/recitation_raw.m4a"

      - name: Commit assets
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/quran/002_al-baqarah_2-155-157_ali-jaber"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add Slot 002 Pinterest clip 011 and Sheikh Ali Jaber 2:155-157 recitation"
          git push origin "HEAD:$BRANCH"
