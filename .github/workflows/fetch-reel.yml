name: Fetch Instagram reel

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Public Instagram reel URL"
        required: true
        default: "https://www.instagram.com/reel/DazBMEAs2aw/"
  push:
    branches:
      - "arena/0cd3db4b-content-plug"
    paths:
      - ".github/triggers/fetch-reel.trigger"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install download tools
        run: python -m pip install --upgrade pip yt-dlp instaloader

      - name: Fetch the reel
        env:
          REEL_URL: ${{ inputs.url || 'https://www.instagram.com/reel/DazBMEAs2aw/?bqrl=MXI2dDA1dWhuNnhrZw==' }}
          SHORTCODE: DazBMEAs2aw
        run: python tools/fetch_instagram_reel.py --url "$REEL_URL" --shortcode "$SHORTCODE"

      - name: Verify saved MP4
        run: |
          test -s "content inputs/DazBMEAs2aw.mp4"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p = Path("content inputs/DazBMEAs2aw.mp4")
          data = p.read_bytes()
          assert len(data) > 10000, f"too small: {len(data)}"
          assert data[4:8] == b"ftyp", f"not mp4: {data[:12]!r}"
          out = subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries",
              "format=duration,size:stream=index,codec_name,codec_type,width,height,sample_rate,channels",
              "-of", "json", str(p),
          ], text=True)
          info = json.loads(out)
          kinds = {s["codec_type"] for s in info["streams"]}
          assert {"video", "audio"} <= kinds, f"missing stream: {kinds}"
          print(f"ok: {len(data)} bytes, streams={sorted(kinds)}")
          print(json.dumps(info, indent=2))
          PY

      - name: Upload debug metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-debug
          path: reel-debug/
          if-no-files-found: warn
          retention-days: 1

      - name: Commit video and sidecar
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "content inputs/DazBMEAs2aw.mp4" "content inputs/DazBMEAs2aw.json"
          if [ -d reel-debug ]; then git add reel-debug/; fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add Instagram reel DazBMEAs2aw"
          git push origin "HEAD:$BRANCH"
