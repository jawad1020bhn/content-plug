name: Fetch Quran video assets

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/0cd3db4b-content-plug"
    paths:
      - ".github/triggers/fetch-quran-assets.trigger"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Fetch and trim assets
        run: python tools/fetch_quran_assets.py

      - name: Verify saved assets
        run: |
          test -s "assets/quran-19-30-33/background.mp4"
          test -s "assets/quran-19-30-33/recitation_19_30_33.m4a"
          test -s "assets/quran-19-30-33/SOURCE.md"
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height -of json \
            "assets/quran-19-30-33/background.mp4"
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,sample_rate,channels -of json \
            "assets/quran-19-30-33/recitation_19_30_33.m4a"

      - name: Commit assets
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/quran-19-30-33"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add Pixabay background and trimmed QF recitation"
          git push origin "HEAD:$BRANCH"
