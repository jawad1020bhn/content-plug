name: Fetch Quran slot 004 assets

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/18726d29-content-plug"
    paths:
      - ".github/triggers/fetch-quran-slot004.trigger"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Fetch Shuraym 2:186 recitation
        run: python tools/fetch_quran_slot004_assets.py

      - name: Verify saved assets
        run: |
          test -s "assets/quran/004_al-baqarah_2-186_shuraim/SOURCE.md"
          test -s "assets/quran/004_al-baqarah_2-186_shuraim/recitation_raw.m4a"
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,sample_rate,channels -of json \
            "assets/quran/004_al-baqarah_2-186_shuraim/recitation_raw.m4a"
          python -c "import json,subprocess; d=float(json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json','assets/quran/004_al-baqarah_2-186_shuraim/recitation_raw.m4a']))['format']['duration']); assert d <= 25.0, d; print(f'duration {d:.3f}s OK (<=25s)')"

      - name: Commit assets
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/quran/004_al-baqarah_2-186_shuraim"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add Slot 004 Shuraym 2:186 recitation"
          git push origin "HEAD:$BRANCH"
